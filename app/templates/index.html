<!doctype html>
<html lang="en">
  <head>
    <meta name="author" content="Jonathan Brierley" />
    <meta name="description" content="Index Analytics Dashboard" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"

    <header>
      <h1>Index Analytics Dashboard</h1>

    <main>

    <footer>

        <p>&copy; 2026 Jonathan Brierley</p>
